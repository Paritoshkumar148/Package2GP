version: 2.1

executors:
  salesforce-executor:
    docker:
      - image: cimg/node:18.17 # CircleCI-maintained Node.js image
    working_directory: ~/project

jobs:
  setup-scratch-org:
    executor: salesforce-executor
    steps:
      - checkout

      # Install jq explicitly
      - run:
          name: "Install jq"
          command: |
            sudo apt-get update && sudo apt-get install -y jq
            jq --version  # Verify jq installation

      # Install Salesforce CLI without requiring root access
      - run:
          name: "Install Salesforce CLI"
          command: |
            mkdir -p ~/.npm-global
            npm config set prefix '~/.npm-global'
            export PATH=~/.npm-global/bin:$PATH
            echo 'export PATH=~/.npm-global/bin:$PATH' >> $BASH_ENV
            source $BASH_ENV
            npm install @salesforce/cli --global
            sf update
            sf --version  # Validate installation

      # Authenticate using the SFDX_URL from CircleCI Environment Variables
      - run:
          name: "Authenticate with Salesforce"
          command: |
            echo $SF_AUTH_URL > sfdx_auth.txt
            sf org login sfdx-url --sfdx-url-file sfdx_auth.txt --set-default-dev-hub
            sf org list

      # Create a new scratch org
      - run:
          name: "Create Scratch Org"
          command: |
            sf org create scratch --set-default --definition-file config/project-scratch-def.json --duration-days 7 --alias MyScratchOrg

      # Push source code to scratch org
      - run:
          name: "Push Source to Scratch Org"
          command: |
            sf project deploy start --target-org MyScratchOrg

      # Run Apex tests in scratch org
      - run:
          name: "Run Apex Tests"
          command: |
            sf apex run test --target-org MyScratchOrg --code-coverage --result-format human

      # Delete scratch org after job is done
      - run:
          name: "Delete Scratch Org"
          command: |
            sf org delete scratch --target-org MyScratchOrg --no-prompt

  create-2gp-package:
    executor: salesforce-executor
    steps:
      - checkout

      # Authenticate with Dev Hub
      - run:
          name: "Authenticate with Dev Hub"
          command: |
            echo $SF_AUTH_URL > sfdx_auth.txt
            sf org login sfdx-url --sfdx-url-file sfdx_auth.txt --set-default-dev-hub
            sf org list

      # Create Package Version
      - run:
          name: "Create 2GP Package Version"
          command: |
            sf package version create --package "MyPackage" --installation-key-bypass --wait 10 --target-dev-hub $SF_DEV_HUB --branch main

workflows:
  version: 2
  salesforce-deployment:
    jobs:
      - setup-scratch-org
      - create-2gp-package:
          requires:
            - setup-scratch-org
