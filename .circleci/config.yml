version: 2.1

executors:
  salesforce-executor:
    docker:
      - image: node:18 # Use a stable Node.js version
    working_directory: ~/project

jobs:
  authenticate-dev-hub:
    executor: salesforce-executor
    steps:
      - checkout
      - run:
          name: "Install Salesforce CLI"
          command: |
            npm install --global @salesforce/cli
            sf --version
      - run:
          name: "Authenticate Dev Hub"
          command: |
            if [ -z "$SF_AUTH_URL" ]; then
              echo "SF_AUTH_URL is not set. Exiting..."
              exit 1
            fi
            echo $SF_AUTH_URL > authfile.json
            sf org login sfdx-url --sfdx-url-file authfile.json --set-default-dev-hub --json

  create-package:
    executor: salesforce-executor
    steps:
      - checkout
      - run:
          name: "Install Salesforce CLI"
          command: |
            npm install --global @salesforce/cli
            sf --version
      - run:
          name: "Create Package"
          command: |
            sf package create --name DemoNilamPro4 --description "Demo Package" --packagetype Unlocked --path force-app --target-dev-hub MyDevHub
      - run:
          name: "Create Package Version"
          command: |
            sf package version create --package DemoNilamPro4 --installation-key-bypass --wait 10 --code-coverage

workflows:
  version: 2
  ci_pipeline:
    jobs:
      - authenticate-dev-hub
      - create-package:
          requires:
            - authenticate-dev-hub
