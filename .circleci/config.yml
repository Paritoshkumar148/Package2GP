version: 2.1

executors:
  salesforce-executor:
    docker:
      - image: node:18 # Use a stable Node.js version
    working_directory: ~/project

jobs:
  create-package:
    executor: salesforce-executor
    steps:
      - checkout

      # Install Salesforce CLI
      - run:
          name: "Install Salesforce CLI"
          command: |
            npm install --global @salesforce/cli

      # Authenticate Dev Hub (if not already authenticated)
      - run:
          name: "Authenticate Dev Hub"
          command: |
            echo $SF_AUTH_URL > authfile.json
            sf org login sfdx-url --set-default-dev-hub --json --sfdx-url-file authfile.json

      # Create a package
      - run:
          name: "Create Package"
          command: |
            sf package create --name DemoNilamPro4 --description "Demo Package" --packagetype Unlocked --path force-app --target-dev-hub MyDevHubAlias

      # Create a package version
      - run:
          name: "Create Package Version"
          command: |
            sf package version create --package DemoNilamPro4 --installation-key-bypass --wait 10 --code-coverage

workflows:
  version: 2
  ci_pipeline:
    jobs:
      - create-package
