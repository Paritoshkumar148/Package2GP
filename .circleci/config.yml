version: 2.1

executors:
  salesforce-executor:
    docker:
      - image: node:18 # Use CircleCI's official image
    working_directory: ~/project

jobs:
  create-package:
    executor: salesforce-executor
    steps:
      - checkout

      # Install Salesforce CLI
      - run:
          name: "Install Salesforce CLI"
          command: |
            npm install --global sfdx-cli
            sf --version  # Verify installation

      # Authenticate Salesforce
      - run:
          name: "Authenticate Dev Hub"
          command: |
            echo $SF_AUTH_URL > authfile
            sf org login sfdx-url -f authfile --set-default-dev-hub

      # Create a package
      - run:
          name: "Create Package"
          command: |
            sf package create --name DemoNilamPro4 --description "Demo Package" --packagetype Unlocked --path force-app --target-dev-hub

      # Create a package version
      - run:
          name: "Create Package Version"
          command: |
            sf package version create --package DemoNilamPro4 --installation-key-bypass --wait 10 --code-coverage

workflows:
  version: 2
  ci_pipeline:
    jobs:
      - create-package
