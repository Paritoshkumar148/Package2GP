version: 2.1

executors:
  salesforce-executor:
    docker:
      - image: node:18
    working_directory: ~/project

jobs:
  create-package-and-deploy:
    executor: salesforce-executor
    steps:
      - checkout

      # Install Salesforce CLI
      - run:
          name: "Install Salesforce CLI"
          command: |
            npm install --global @salesforce/cli
            echo 'export PATH=~/.npm-global/bin:$PATH' >> $BASH_ENV
            echo 'export PATH=~/.local/share/sf/bin:$PATH' >> $BASH_ENV
            source $BASH_ENV
            sf update
            sf --version

      # Install jq (JSON processor)
      - run:
          name: "Install jq"
          command: |
            apt-get update && apt-get install -y jq
            jq --version  # Verify installation

      # Authenticate Dev Hub
      - run:
          name: "Authenticate Dev Hub"
          command: |
            echo $SF_AUTH_URL > authfile
            sf org login sfdx-url -f authfile --set-default-dev-hub --alias MyDevHub
            sf org list

      # Create a package
      - run:
          name: "Create Package"
          command: |
            sf package create --name DemoNilamSuper39 --description "Demo Package" --packagetype Unlocked --path force-app --target-dev-hub MyDevHub

      # Create a package version
      - run:
          name: "Create Package Version"
          command: |
            sf package version create --package DemoNilamSuper39 --installation-key-bypass --wait 10 --code-coverage --target-dev-hub MyDevHub

      # Create Scratch Org
      - run:
          name: "Create Scratch Org"
          command: |
            sf org create scratch --definition-file config/project-scratch-def.json --set-default --alias MyScratchOrg --target-dev-hub MyDevHub
            sf org list

      # Install package in Scratch Org
      - run:
          name: "Install Package in Scratch Org"
          command: |
            PACKAGE_VERSION_ID=$(sf package version list --target-dev-hub MyDevHub --json | jq -r '.result[0].SubscriberPackageVersionId')
            echo "Installing package with ID: $PACKAGE_VERSION_ID"
            sf package install --package $PACKAGE_VERSION_ID --wait 10 --publish-wait 10 --target-org MyScratchOrg --no-prompt

      # Display Scratch Org details
      - run:
          name: "Display Scratch Org Info"
          command: |
            sf org display --target-org MyScratchOrg

workflows:
  version: 2
  ci_pipeline:
    jobs:
      - create-package-and-deploy
