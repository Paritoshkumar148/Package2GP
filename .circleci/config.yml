version: 2.1

executors:
  salesforce-executor:
    docker:
      - image: node:18 # Use CircleCI's official image
    working_directory: ~/project

jobs:
  create-package:
    executor: salesforce-executor
    steps:
      - checkout

      # Install Salesforce CLI
      - run:
          name: "Install Salesforce CLI"
          command: |
            npm install --global @salesforce/cli
            echo 'export PATH=~/.npm-global/bin:$PATH' >> $BASH_ENV
            echo 'export PATH=~/.local/share/sf/bin:$PATH' >> $BASH_ENV
            source $BASH_ENV
            sf update
            sf --version  # Validate installation

      # Authenticate Salesforce Dev Hub
      - run:
          name: "Authenticate Dev Hub"
          command: |
            echo $SF_AUTH_URL > authfile
            sf org login sfdx-url -f authfile --set-default-dev-hub --alias MyDevHub
            sf org list

      # Set correct alias mapping (if needed)
      - run:
          name: "Ensure Alias Mapping"
          command: |
            sf alias set MyDevHub=devhubenable@paritosh.com
            sf alias list  # Verify aliases

      # Create a package
      - run:
          name: "Create Package"
          command: |
            sf package create --name DemoNilamSuper --description "Demo Package" --packagetype Unlocked --path force-app --target-dev-hub MyDevHub

      # Create a package version
      - run:
          name: "Create Package Version"
          command: |
            sf package version create --package DemoNilamProSuper --installation-key-bypass --wait 10 --code-coverage

workflows:
  version: 2
  ci_pipeline:
    jobs:
      - create-package
