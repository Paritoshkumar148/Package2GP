version: 2.1

executors:
  sf-cli:
    docker:
      - image: salesforce/salesforcedx:latest

jobs:
  setup:
    executor: sf-cli
    steps:
      - checkout
      - run:
          name: Authenticate Dev Hub
          command: |
            echo $SFDX_AUTH_URL > authfile.txt
            sf auth sfdxurl store -f authfile.txt --set-default-dev-hub
            sf config set target-dev-hub=my-dev-hub

  create-package:
    executor: sf-cli
    steps:
      - checkout
      - run:
          name: Create Salesforce Package (if not exists)
          command: |
            PACKAGE_NAME="DemoNilamProSuper1"
            PACKAGE_ID=$(sf package list --json | jq -r '.result[] | select(.Name=="'"$PACKAGE_NAME"'") | .Id')
            if [ -z "$PACKAGE_ID" ]; then
              sf package create --name $PACKAGE_NAME --description "Demo Package" --packagetype Unlocked --path force-app
            else
              echo "Package already exists."
            fi

  create-package-version:
    executor: sf-cli
    steps:
      - checkout
      - run:
          name: Create Package Version
          command: |
            sf package version create --package DemoNilamProSuper1 --installation-key-bypass --wait 10 --code-coverage

workflows:
  version: 2
  deploy:
    jobs:
      - setup
      - create-package:
          requires:
            - setup
      - create-package-version:
          requires:
            - create-package
      - install-validate:
          requires:
            - create-package-version
