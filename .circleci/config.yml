version: 2.1

executors:
  salesforce-executor:
    docker:
      - image: node:18 # Use a stable Node.js version
    working_directory: ~/project

jobs:
  setup-scratch-org:
    executor: salesforce-executor
    steps:
      - checkout

      # Check for existing Scratch Org
      - run:
          name: "Check Existing Scratch Org"
          command: |
            EXISTING_ORG=$(sf org list --json | jq -r '.result[] | select(.isScratchOrg == true and .status == "Active") | .alias')
            if [ -n "$EXISTING_ORG" ]; then
              echo "Reusing existing Scratch Org: $EXISTING_ORG"
              sf org set default --target-org "$EXISTING_ORG"
            else
              echo "No active Scratch Org found. Creating a new one..."
              sf org create scratch --definition-file config/project-scratch-def.json --set-default --duration-days 1 --alias ScratchOrg
            fi

      # Push metadata to Scratch Org
      - run:
          name: "Push Source to Scratch Org"
          command: sf project deploy start --source-dir force-app

      # Create a package
      - run:
          name: "Create Package"
          command: |
            sf package create --name DemoNilamPro4 --description "Demo Package" --packagetype Unlocked --path force-app --target-dev-hub

      # Create a package version
      - run:
          name: "Create Package Version"
          command: |
            sf package version create --package DemoNilamPro4 --installation-key-bypass --wait 10 --code-coverage

      # Run Apex tests with Code Coverage
      - run:
          name: "Run Apex Tests"
          command: sf apex run test --code-coverage --result-format human

      # Delete the Scratch Org after tests (Cleanup)
      - run:
          name: "Delete Scratch Org"
          command: |
            EXISTING_ORG=$(sf org list --json | jq -r '.result[] | select(.isScratchOrg == true and .status == "Active") | .alias')
            if [ -n "$EXISTING_ORG" ]; then
              echo "Deleting Scratch Org: $EXISTING_ORG"
              sf org delete scratch --target-org "$EXISTING_ORG" --no-prompt
            else
              echo "No active Scratch Org to delete."
            fi

workflows:
  version: 2
  ci_pipeline:
    jobs:
      - setup-scratch-org
