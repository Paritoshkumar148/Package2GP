version: 2.1

executors:
  salesforce-executor:
    docker:
      - image: cimg/node:18.16
    working_directory: ~/project

jobs:
  setup:
    executor: salesforce-executor
    steps:
      - checkout
      - run:
          name: Install Salesforce CLI
          command: |
            npm install --global sfdx-cli
            sf --version
      - run:
          name: Authenticate DevHub
          command: echo $SF_AUTH_URL | sf org login sfdx-url --set-default-dev-hub --json
      - persist_to_workspace:
          root: ~/project
          paths: .

  create-package:
    executor: salesforce-executor
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Check if Package Exists
          command: |
            PACKAGE_NAME="DemoNilamProSuper123"
            PACKAGE_ID=$(sf package list --json | jq -r ".result[] | select(.Name==\"$PACKAGE_NAME\") | .Id")

            if [[ -z "$PACKAGE_ID" ]]; then
              echo "Package does not exist. Creating package..."
              PACKAGE_ID=$(sf package create -n "$PACKAGE_NAME" -t Managed -r force-app -v DevHub --json | jq -r '.result.id')
              echo "Package created with ID: $PACKAGE_ID"
            else
              echo "Package already exists with ID: $PACKAGE_ID"
            fi

            # Update sfdx-project.json dynamically
            jq --arg name "$PACKAGE_NAME" --arg id "$PACKAGE_ID" '.packageAliases[$name] = $id' sfdx-project.json > temp.json && mv temp.json sfdx-project.json

      - persist_to_workspace:
          root: ~/project
          paths: .

  create-package-version:
    executor: salesforce-executor
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Create Package Version
          command: |
            PACKAGE_NAME="DemoNilamProSuper123"
            PACKAGE_ID=$(jq -r ".packageAliases[\"$PACKAGE_NAME\"]" sfdx-project.json)

            if [[ -z "$PACKAGE_ID" ]]; then
              echo "Error: Package ID not found in sfdx-project.json. Exiting..."
              exit 1
            fi

            sf package version create -p "$PACKAGE_NAME" -d force-app -v DevHub --wait 10 --json

  push-changes:
    executor: salesforce-executor
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Push Updated sfdx-project.json to GitHub
          command: |
            git config --global user.email "your-email@example.com"
            git config --global user.name "CircleCI Bot"
            git add sfdx-project.json
            git commit -m "Updated sfdx-project.json with package ID"
            git push origin main

workflows:
  version: 2
  salesforce-ci:
    jobs:
      - setup
      - create-package:
          requires:
            - setup
      - create-package-version:
          requires:
            - create-package
      - push-changes:
          requires:
            - create-package-version
