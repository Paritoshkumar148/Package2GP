version: 2.1

executors:
  salesforce-executor:
    docker:
      - image: node:18 # Use CircleCI's official image
    working_directory: ~/project

jobs:
  create-package:
    executor: salesforce-executor
    steps:
      - checkout

        # Install the new Salesforce CLI correctly
      - run:
          name: "Install Salesforce CLI"
          command: |
            npm install --global @salesforce/cli
            echo 'export PATH=~/.npm-global/bin:$PATH' >> $BASH_ENV
            echo 'export PATH=~/.local/share/sf/bin:$PATH' >> $BASH_ENV
            source $BASH_ENV
            sf update
            sf --version  # Validate installation

      # Authenticate using the SFDX_URL from CircleCI Environment Variables
      - run:
          name: "Authenticate with Salesforce"
          command: |
            echo $SF_AUTH_URL > sfdx_auth.txt
            sf org login sfdx-url --sfdx-url-file sfdx_auth.txt --set-default-dev-hub
            sf org list

      # Create a package
      - run:
          name: "Create Package"
          command: |
            sf package create --name DemoNilamPro4 --description "Demo Package" --packagetype Unlocked --path force-app --target-dev-hub MyDevHub

      # Create a package version
      - run:
          name: "Create Package Version"
          command: |
            sf package version create --package DemoNilamPro4 --installation-key-bypass --wait 10 --code-coverage

workflows:
  version: 2
  ci_pipeline:
    jobs:
      - create-package
